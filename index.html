<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
  <title>Town Walk</title>
  <style>
    /* Online tower study: the game fills the whole window; while it loads, the approved text N-1 and a progress bar. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1c20; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1a1c20; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      color: #eeeeec; font: 22px/1.4 "Segoe UI", Arial, sans-serif; text-align: center; padding: 0 24px; }
    #bar { width: min(420px, 80vw); height: 10px; background: #3a3e46; border-radius: 5px; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #6d9bd6; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>Loading the town. This can take up to a minute.</div><div id="bar"><div id="fill"></div></div></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/step3.data.unityweb",
      frameworkUrl: "Build/step3.framework.js.unityweb",
      codeUrl: "Build/step3.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "TowerStudy",
      productName: "Town Walk",
      productVersion: "1.0",
    };
    var script = document.createElement("script");
    script.src = "Build/step3.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { document.querySelector("#fill").style.width = (100 * p) + "%"; })
        .then(function (inst) { window.unityInstance = inst; document.querySelector("#loading").style.display = "none"; })
        .catch(function (m) { document.querySelector("#loading").textContent = m; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
